name: Quality assurance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    strategy:
      matrix:
        php: [ '8.2','8.3','8.4','8.5' ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: xdebug
          tools: phing:v3

      - name: Install GraphViz (PlantUML requirement)
        run: |
          sudo apt --yes update
          sudo apt --yes install graphviz

      - uses: actions/checkout@v7

      - name: Install Composer dependencies
        run: phing composer:install

      - name: Lint
        run: phing php:lint composer:validate

      - name: PHPUnit
        run: phing phpunit:testdox

      - name: Psalm
        run: phing psalm:run

      - name: Code Style
        run: phing cs:check
